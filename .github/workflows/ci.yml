name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependency advisories
        run: pnpm audit --audit-level high
      - name: Check TypeScript workspace
        run: pnpm check
      - name: Build TypeScript workspace
        run: pnpm build
      - name: Scan Git history for private key material
        shell: bash
        run: |
          pattern='(ed25519|secp256k1):[A-Za-z0-9+/=_-]{40,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|NEAR_AI_API_KEY=[A-Za-z0-9_/-]{20,}'
          if git grep -I -l -E "$pattern" $(git rev-list --all) -- . > /tmp/auvora-secret-paths; then
            echo 'Potential private key material found in these tracked paths:' >&2
            sed -E 's/^[^:]+://' /tmp/auvora-secret-paths | sort -u >&2
            exit 1
          fi

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh \
            -o /tmp/cargo-near-installer.sh
          echo 'efbc260384a2e40c5690a6e0c5eae125eaa51347e38dfaaff07d342e704486f7  /tmp/cargo-near-installer.sh' \
            | sha256sum --check
          sh /tmp/cargo-near-installer.sh
          cargo near --version
      - name: Install cargo-audit
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz \
            -o /tmp/cargo-audit.tgz
          echo 'ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  /tmp/cargo-audit.tgz' \
            | sha256sum --check
          tar -xzf /tmp/cargo-audit.tgz -C /tmp
          install -m 0755 \
            /tmp/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit \
            "$HOME/.cargo/bin/cargo-audit"
          cargo audit --version
      - name: Audit Rust dependency advisories
        # These four advisories are currently pulled in only by NEAR's host-side
        # unit-test/sandbox graph. They are absent from the normal WASM graph and
        # remain documented in docs/KNOWN_LIMITATIONS.md until upstream updates.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0387
          --ignore RUSTSEC-2026-0391
          --ignore RUSTSEC-2026-0398
          --ignore RUSTSEC-2026-0403
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run unit and sandbox tests
        run: cargo test --workspace --locked
      - name: Build contract WASM
        working-directory: contracts/treasury
        run: cargo near build non-reproducible-wasm --locked
